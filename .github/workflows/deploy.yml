name: Deploy V3 test build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not abort a Pages deployment mid-flight when a new commit arrives.
concurrency:
  group: "v3-github-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Safety check
        run: npm run check:safety
      - name: Run built-in tests
        run: npm test
      - name: Verify live Supabase read (no writes)
        run: npm run verify:catalog
      - name: Copy and hash-verify V2 media into isolated V3
        run: npm run sync:media
      - name: Inspect exact milk-video duration
        run: node scripts/inspect-media-duration.mjs
      - name: Build
        run: npm run build
      - name: Verify independent Pages routes and media
        run: npm run verify:pages
      # Temporary, precisely scoped recovery for the Pages deployment that
      # remained active after the failed 2026-11-05 publishing attempt.
      # The workflow's existing pages:write GitHub token is used here.
      - name: Release stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Attempting to release stale Pages deployment 5933214a..."
          if gh api -X POST "repos/${{ github.repository }}/pages/deployments/5933214a40c4a23ee762e4bdf32fe6d94deb1202/cancel" --silent; then
            echo "Stale Pages deployment cancellation acknowledged."
          else
            echo "::warning::Pages cancellation request was not accepted; deployment will be attempted normally."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
