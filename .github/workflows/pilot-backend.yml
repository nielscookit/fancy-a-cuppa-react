name: Isolated pilot backend
on:
  push:
    branches: [feature/native-ios]
    paths:
      - supabase/pilot/**
      - supabase/functions/community-tea/**
      - supabase/functions/community-tea-v4/**
      - scripts/verify-ios-pilot-*.mjs
      - .github/workflows/pilot-backend.yml
permissions:
  contents: read
jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned existing CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/pilot-tools" --no-audit --no-fund supabase@3.1.0
          echo "$RUNNER_TEMP/pilot-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare dedicated local sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/fac-pilot-ci"
          cd "$RUNNER_TEMP/fac-pilot-ci"
          supabase init
          python - <<'PYPORT'
          import os, re, socket
          from pathlib import Path
          path=Path('supabase/config.toml')
          text=path.read_text()
          sockets=[]
          ports={}
          for old in sorted(set(re.findall(r'5432[0-9]',text))):
              sock=socket.socket()
              sock.bind(('0.0.0.0',0))
              sockets.append(sock)
              ports[old]=str(sock.getsockname()[1])
          project='fac-pilot-'+os.environ['GITHUB_RUN_ID']
          text=re.sub(r'project_id = "[^"]+"','project_id = "'+project+'"',text)
          text=re.sub(r'5432[0-9]',lambda m:ports[m[0]],text)
          path.write_text(text)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('FAC_LOCAL_DB_CONTAINER=supabase_db_'+project+'\n')
              env.write('PILOT_LOCAL_API=http://127.0.0.1:'+ports['54321']+'\n')
          for sock in sockets: sock.close()
          PYPORT
          cp -R "$GITHUB_WORKSPACE/supabase/functions" supabase/
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/tests/fixtures/community-tea-local-schema.sql" supabase/migrations/20261110000000_local_fixture.sql
          cp "$GITHUB_WORKSPACE/supabase/migrations/"*community_tea*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/pilot/installation-authority.sql" supabase/migrations/20261123000000_local_pilot.sql
          cat "$GITHUB_WORKSPACE/supabase/config.toml" >> supabase/config.toml
          supabase start
      - name: Run real isolated pilot integration
        run: |
          cd "$RUNNER_TEMP/fac-pilot-ci"
          echo 'COMMUNITY_TEA_IOS_PILOT_READY=true' > "$RUNNER_TEMP/pilot.env"
          echo "COMMUNITY_TEA_PUBLIC_URL=$PILOT_LOCAL_API" >> "$RUNNER_TEMP/pilot.env"
          supabase functions serve --env-file "$RUNNER_TEMP/pilot.env" --no-verify-jwt > "$RUNNER_TEMP/pilot-edge.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "$PILOT_LOCAL_API/functions/v1/community-tea-v4?capabilities=ios-pilot" >/dev/null; then break; fi
            sleep 2
          done
          node "$GITHUB_WORKSPACE/scripts/verify-ios-pilot-local.mjs"
      - name: Stop isolated sandbox
        if: always()
        run: |
          cd "$RUNNER_TEMP/fac-pilot-ci"
          supabase stop --no-backup
