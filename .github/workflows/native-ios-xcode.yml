name: Verify unsigned iOS Simulator build

on:
  push:
    branches: [feature/native-ios]
    paths:
      - .github/workflows/native-ios-xcode.yml
      - ios/App/App.xcodeproj/project.pbxproj
      - scripts/prepare-ios-ready-sound.sh
      - src/push/nativeNotificationController.js
      - src/push/nativeNotificationController.test.js
      - public/audio/Ready.mp3
      - src/timer-kit/mediaController.js
      - src/timer/videoPreloader.js
      - tests/videoPreloader.test.mjs
      - src/timer-kit/nativeVideoController.js
      - tests/nativeVideoController.test.mjs
      - ios/App/LiveActivity/**
      - ios/App/App/Info.plist
      - ios/App/App/SceneDelegate.swift
      - ios/App/App/FACTeaCameraPlugin.swift
      - tests/nativeTeaCamera.test.mjs
      - tests/nativeTeaEditorRendering.test.mjs
      - src/features/nativeTeaCamera.js
      - src/features/uc02PhotoPrefill.js
      - tests/uc02PhotoPrefill.test.mjs
      - src/features/nativeQuickAccess.js
      - src/features/voiceTeaIntent.js
      - tests/voiceTea.test.mjs
      - src/features/teaModel.js
      - src/components/TeaImageGallery.jsx
      - src/components/TeaEditor.jsx
      - src/components/tea-sheet.css
      - src/App.jsx
      - public/figma/uc02-*
      - tests/nativeLiveActivityPrototype.test.mjs
      - ios/App/App/FACIosPilotPlugin.swift
      - src/data/teaRepository.js
      - supabase/functions/community-tea/**
      - supabase/functions/community-tea-v4/**
      - supabase/pilot/**
      - tests/communityTeaCors.test.mjs
      - scripts/build-ios-pilot.mjs
      - scripts/ios-pilot-config.mjs
      - tests/iosPilotConfig.test.mjs
      - scripts/build-ios-uc02-local.mjs
      - scripts/uc02-ios-config.mjs
      - vite.native.config.js
      - ios/debug.xcconfig

permissions:
  contents: write # Only commit native ios/ source files after successful build

jobs:
  ios-simulator-build:
    if: github.ref == 'refs/heads/feature/native-ios'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - name: Checkout native branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphonesimulator --show-sdk-version
          printf 'import AlarmKit\n' > "$RUNNER_TEMP/check-alarmkit.swift"
          xcrun --sdk iphonesimulator swiftc -typecheck \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target "$(uname -m)-apple-ios26.0-simulator" "$RUNNER_TEMP/check-alarmkit.swift"
      - name: Check native iOS project exists
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/CapApp-SPM/Package.swift
      - name: Install exact JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests and safety checks
        run: |
          npm run check:safety
          npm test
      - name: Convert and validate bundled custom Ready sound
        run: bash scripts/prepare-ios-ready-sound.sh
      - name: Restore checked V2 media and build native assets
        run: |
          npm run sync:media
          npm run build:native
          test -s dist-native/index.html
      - name: Sync Capacitor iOS project
        run: |
          npx cap sync ios
          test -s ios/App/App/public/index.html
      - name: Compile unsigned iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/fancy-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d "$RUNNER_TEMP/fancy-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$RUNNER_TEMP/fancy-ios-derived/Build/Products/Debug-iphonesimulator/App.app/PlugIns/FACLiveActivityExtension.appex"
      - name: Verify Ready.caf is in the app's main bundle
        run: |
          APP="$RUNNER_TEMP/fancy-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -s "$APP/Ready.caf"
          cmp "$APP/Ready.caf" ios/App/App/Ready.caf
          echo "Validated Ready.caf in App.app root (not just the WebView)."
      - name: Verify compiled app icon metadata
        run: |
          APP="$RUNNER_TEMP/fancy-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist")" = AppIcon
      - name: Compile isolated iOS Pilot Release with a readiness fixture
        run: |
          set -euo pipefail
          # Exercise the Release bundle without connecting CI to production.
          node --input-type=module <<'JS'
          import { build } from 'vite';
          globalThis.fetch = async (url, options) => {
            const target = new URL(url);
            if (target.origin !== 'https://zfkiiqqyapahxirguxgj.supabase.co' || options?.method !== 'GET') {
              throw Error('Unexpected iOS Pilot fixture request');
            }
            if (target.pathname === '/rest/v1/teas') return Response.json([{ origin: 'curated', revision: 1 }]);
            if (target.pathname === '/functions/v1/community-tea-v4') {
              return Response.json({ contract: 'fancy-a-cuppa/uc02-v4-pilot-auth', pilotReady: true });
            }
            throw Error('Unexpected iOS Pilot fixture route');
          };
          await build({ configFile: 'vite.native.config.js', mode: 'ios-pilot' });
          JS
          npx cap sync ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/fancy-ios-derived" \
            CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/fancy-ios-derived/Build/Products/Release-iphonesimulator/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.fancyacuppa.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/PlugIns/FACLiveActivityExtension.appex/Info.plist")" = com.fancyacuppa.app.liveactivity
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist")" = AppIcon
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/PlugIns/FACLiveActivityExtension.appex/Info.plist")"
          grep -q 'fac-ios-pilot' "$APP/public/index.html"
          grep -R -F -q '/functions/v1/community-tea-v4' "$APP/public/assets"
          grep -R -F -q 'https://zfkiiqqyapahxirguxgj.supabase.co' "$APP/public/assets"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$APP/Info.plist" ||
             grep -q 'fac-uc02-local' "$APP/public/index.html" ||
             grep -R -E -l 'http://(127\.0\.0\.1|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)' "$APP/public/assets"; then
            echo 'Release build contains local test settings.' >&2
            exit 1
          fi
      - name: Compile isolated UC02 Debug app and validate its identity and network settings
        env:
          VITE_COMMUNITY_TEA_V4: 'true'
          FAC_UC02_SUPABASE_URL: http://127.0.0.1:54321
          FAC_UC02_SUPABASE_PUBLIC_KEY: sb_publishable_ci_fixture
        run: |
          set -euo pipefail
          NORMAL="$RUNNER_TEMP/fancy-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$NORMAL/Info.plist" ||
             grep -q 'fac-uc02-local' "$NORMAL/public/index.html"; then
            echo 'Normal Debug build contains UC02 test settings.' >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$NORMAL/Info.plist")" = com.fancyacuppa.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$NORMAL/Info.plist")" = 'Fancy a Cuppa'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$NORMAL/PlugIns/FACLiveActivityExtension.appex/Info.plist")" = com.fancyacuppa.app.liveactivity
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$NORMAL/Info.plist")" = com.fancyacuppa.app.quick-access
          npm run build:ios-uc02-local
          if grep -R -F -l 'zfkiiqqyapahxirguxgj.supabase.co' ios/App/App/public/assets; then
            echo 'Production Supabase endpoint in the synced UC02 web assets.' >&2
            exit 1
          fi
          TEST_APP="$RUNNER_TEMP/fancy-uc02-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/fancy-uc02-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEST_APP/Info.plist")" = com.fancyacuppa.test
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$TEST_APP/Info.plist")" = 'Fancy Test'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEST_APP/PlugIns/FACLiveActivityExtension.appex/Info.plist")" = com.fancyacuppa.test.liveactivity
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$TEST_APP/Info.plist")" = com.fancyacuppa.test.quick-access
          for icon in timer scanner; do
            test -s "$TEST_APP/PlugIns/FACLiveActivityExtension.appex/uc01-$icon.png"
          done
          grep -q 'fac-uc02-local' "$TEST_APP/public/index.html"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSExceptionDomains:127.0.0.1:NSExceptionAllowsInsecureHTTPLoads' "$TEST_APP/Info.plist")" = true
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$TEST_APP/Info.plist"
          if grep -R -F -l 'zfkiiqqyapahxirguxgj.supabase.co' "$TEST_APP/public/assets"; then
            echo 'Production Supabase endpoint in the isolated bundle.' >&2
            exit 1
          fi
      - name: Commit Capacitor-synced iOS source files
        run: |
          git add ios/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(native): bundle custom Ready sound for iOS"
            # Other native-branch commits may arrive while Xcode is compiling.
            # Rebase only this generated commit; never force-push or touch main.
            for attempt in 1 2 3; do
              git fetch origin feature/native-ios
              git rebase origin/feature/native-ios
              if git push origin HEAD:feature/native-ios; then
                echo "Generated Ready.caf saved to feature/native-ios."
                exit 0
              fi
              echo "Native branch advanced again; retrying ($attempt/3)."
            done
            echo "Could not safely publish generated iOS asset after 3 attempts." >&2
            exit 1
          fi
      - name: Confirm build product
        run: echo "Unsigned iOS Simulator App.app built with Ready.caf verified in root bundle; no iPhone installation, signing or deployment performed."
