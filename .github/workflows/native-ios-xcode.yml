name: Verify unsigned iOS Simulator build

on:
  push:
    branches: [feature/native-ios]
    paths:
      - .github/workflows/native-ios-xcode.yml
      - ios/App/App.xcodeproj/project.pbxproj
      - scripts/prepare-ios-ready-sound.sh
      - src/push/nativeNotificationController.js
      - src/push/nativeNotificationController.test.js
      - public/audio/Ready.mp3
      - src/timer-kit/mediaController.js
      - src/timer/videoPreloader.js
      - tests/videoPreloader.test.mjs
      - src/timer-kit/nativeVideoController.js
      - tests/nativeVideoController.test.mjs

permissions:
  contents: write # Only commit native ios/ source files after successful build

jobs:
  ios-simulator-build:
    if: github.ref == 'refs/heads/feature/native-ios'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout native branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
      - name: Check native iOS project exists
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/CapApp-SPM/Package.swift
      - name: Install exact JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests and safety checks
        run: |
          npm run check:safety
          npm test
      - name: Convert and validate bundled custom Ready sound
        run: bash scripts/prepare-ios-ready-sound.sh
      - name: Restore checked V2 media and build native assets
        run: |
          npm run sync:media
          npm run build:native
          test -s dist-native/index.html
      - name: Sync Capacitor iOS project
        run: |
          npx cap sync ios
          test -s ios/App/App/public/index.html
      - name: Compile unsigned iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/fancy-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d "$RUNNER_TEMP/fancy-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
      - name: Verify Ready.caf is in the app's main bundle
        run: |
          APP="$RUNNER_TEMP/fancy-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -s "$APP/Ready.caf"
          cmp "$APP/Ready.caf" ios/App/App/Ready.caf
          echo "Validated Ready.caf in App.app root (not just the WebView)."
      - name: Commit Capacitor-synced iOS source files
        run: |
          git add ios/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(native): bundle custom Ready sound for iOS"
            # Other native-branch commits may arrive while Xcode is compiling.
            # Rebase only this generated commit; never force-push or touch main.
            for attempt in 1 2 3; do
              git fetch origin feature/native-ios
              git rebase origin/feature/native-ios
              if git push origin HEAD:feature/native-ios; then
                echo "Generated Ready.caf saved to feature/native-ios."
                exit 0
              fi
              echo "Native branch advanced again; retrying ($attempt/3)."
            done
            echo "Could not safely publish generated iOS asset after 3 attempts." >&2
            exit 1
          fi
      - name: Confirm build product
        run: echo "Unsigned iOS Simulator App.app built with Ready.caf verified in root bundle; no iPhone installation, signing or deployment performed."
