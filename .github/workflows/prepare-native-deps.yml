name: Prepare native iOS dependencies (manual)

# Manual only. Does not run on push and does not deploy Pages.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-capacitor:
    if: github.ref == 'refs/heads/feature/native-ios'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-ios
          persist-credentials: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Generate consistent npm lockfile, test both builds
        run: bash scripts/setup-native-capacitor.sh
      - name: Commit dependency manifest and lockfile
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Install Capacitor 8.6.0 and regenerate npm lockfile"
            git push origin HEAD:feature/native-ios
          fi
